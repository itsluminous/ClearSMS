org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Introduced when AGP 8.7.3's bundled lint crashed (IncompatibleClassChangeError
# in NonNullableMutableLiveDataDetector) analyzing Kotlin 2.3.x sources. AGP
# 8.10.1's bundled lint no longer crashes (verified), but the override is kept
# so the checks stay at the 8.13 level that CI has been validating against.
# AGP 8.10.1 is the newest 8.x that runs on Gradle 9.6+ (8.11+ binds to a
# removed Gradle internal API), and AGP 9 is intentionally held back - see
# the deps/2026-09-sweep branch notes. Drop this line once AGP reaches 8.13+.
android.experimental.lint.version=8.13.2
