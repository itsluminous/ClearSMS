name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Verifies gradle-wrapper.jar against the official checksums so a
      # tampered wrapper can never execute in CI (the release job inherits
      # this guarantee via `needs: check`).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: ktlint, Android Lint, unit tests
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest

      - name: Upload test & lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 7

  release:
    name: Build release APKs
    needs: check
    runs-on: ubuntu-latest
    # Creating a GitHub Release writes to the repository, which the default
    # GITHUB_TOKEN cannot do (workflow tokens are read-only by default).
    permissions:
      contents: write
    env:
      # True only when all four signing secrets are configured. Forks and PRs
      # from forks have no secrets, so their builds fall back to unsigned
      # release APKs instead of failing.
      HAS_SIGNING_SECRETS: >-
        ${{
          secrets.SIGNING_KEYSTORE_BASE64 != '' &&
          secrets.SIGNING_KEYSTORE_PASSWORD != '' &&
          secrets.SIGNING_KEY_ALIAS != '' &&
          secrets.SIGNING_KEY_PASSWORD != ''
        }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: printf '%s' "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble release APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$HAS_SIGNING_SECRETS" = "true" ]; then
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
          fi
          ./gradlew assembleRelease

      - name: Verify APK signatures
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "==> $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: clearsms-release
          path: app/build/outputs/apk/release/*.apk

      # Sender logo artwork is bundled in the APK's assets (committed under
      # app/src/main/assets/logos/, regenerated via
      # scripts/build_logo_pack.py --bundle), so releases no longer build
      # or attach a separate logo-pack zip.
      # The release body is the SAME user-facing changelog F-Droid shows, so
      # the two never tell different stories. A missing file cannot break the
      # release: the step writes a minimal stand-in instead of failing, and
      # GitHub's generated commit list is appended either way.
      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          code=$(grep -m1 'versionCode *=' app/build.gradle.kts | tr -dc '0-9')
          notes="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          if [ -s "$notes" ]; then
            cp "$notes" release-notes.md
          else
            echo "See the commit list below for what changed." > release-notes.md
          fi
          echo "--- release notes ---"; cat release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: release-notes.md
          generate_release_notes: true

  # Redeploys the website so its Download buttons point at the APK just
  # published by the `release` job above. A release created with GITHUB_TOKEN
  # starts no other workflow's `release` event, but a workflow_dispatch does.
  # Its own job, so the third-party release action above never holds
  # `actions: write`.
  redeploy-site:
    name: Redeploy website
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # The REST call needs only `actions: write` (the job has nothing else).
      # It passes the tag, so the deploy waits for GitHub to list this release
      # as the latest. curl retries only transient failures (timeouts, 408,
      # 429, 5xx); a refused call fails the job, which leaves the release as
      # published: run "Deploy website" by hand then (the daily run also
      # catches up).
      - name: Start the Deploy website workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          jq -n --arg tag "$TAG" '{ref: "main", inputs: {tag: $tag}}' > dispatch.json
          curl -sS --fail-with-body --retry 3 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            --data-binary @dispatch.json
          echo "Started Deploy website on main for $TAG." >> "$GITHUB_STEP_SUMMARY"
