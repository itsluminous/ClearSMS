name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifies gradle-wrapper.jar against the official checksums so a
      # tampered wrapper can never execute in CI (the release job inherits
      # this guarantee via `needs: check`).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: ktlint, Android Lint, unit tests
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest

      - name: Upload test & lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 7

  release:
    name: Build release APKs
    needs: check
    runs-on: ubuntu-latest
    # Creating a GitHub Release writes to the repository, which the default
    # GITHUB_TOKEN cannot do (workflow tokens are read-only by default).
    permissions:
      contents: write
    env:
      # True only when all four signing secrets are configured. Forks and PRs
      # from forks have no secrets, so their builds fall back to unsigned
      # release APKs instead of failing.
      HAS_SIGNING_SECRETS: >-
        ${{
          secrets.SIGNING_KEYSTORE_BASE64 != '' &&
          secrets.SIGNING_KEYSTORE_PASSWORD != '' &&
          secrets.SIGNING_KEY_ALIAS != '' &&
          secrets.SIGNING_KEY_PASSWORD != ''
        }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: printf '%s' "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble release APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$HAS_SIGNING_SECRETS" = "true" ]; then
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
          fi
          ./gradlew assembleRelease

      - name: Verify APK signatures
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "==> $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: clearsms-release
          path: app/build/outputs/apk/release/*.apk

      # Optional sender logo pack, assembled from pinned MIT-licensed
      # upstreams and attached to the release for users who opt in
      # (Settings -> Appearance -> Sender logo pack). Lives in this job so
      # a second workflow never races the APK release creation. It must
      # never block the APK release: the step is continue-on-error and
      # softprops tolerates the missing zip (fail_on_unmatched_files is
      # false by default).
      - name: Build optional sender logo pack
        id: logo_pack
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          python3 scripts/build_logo_pack.py --out dist/logo-pack

      - name: Warn when the logo pack could not be built
        if: startsWith(github.ref, 'refs/tags/v') && steps.logo_pack.outcome == 'failure'
        run: echo "::warning::Sender logo pack build failed (upstream fetch or conversion); the release ships without it."

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            dist/logo-pack/clearsms-logo-pack.zip
          generate_release_notes: true
